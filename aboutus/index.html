  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    * {
      border-radius: 0px !important;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F6;
      color: #111111;
      overflow-x: hidden;
    }
    h1, h2, .font-display {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .accordion-content {
      display: none;
    }
    .accordion-content.open {
      display: block;
    }

    /* Плавное появление блоков при загрузке и прокрутке */
    .reveal-block {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal-block.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Бесконечная плавная бегущая строка партнеров (влево или вправо) */
    @keyframes marqueeLeft {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }
    @keyframes marqueeRight {
      0% {
        transform: translate3d(-50%, 0, 0);
      }
      100% {
        transform: translate3d(0, 0, 0);
      }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      will-change: transform;
    }
    .marquee-track.dir-left {
      animation: marqueeLeft var(--marquee-duration, 42s) linear infinite;
    }
    .marquee-track.dir-right {
      animation: marqueeRight var(--marquee-duration, 42s) linear infinite;
    }
    .marquee-wrapper:hover .marquee-track {
      animation-play-state: paused;
    }
  </style>
</head>

    let currentLang = SITE_CONFIG.defaultLang;
    const openAccordions = new Set();

    // Привязка маршрутов логотипов
    document.getElementById('header-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);
    document.getElementById('menu-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);

    // Отрисовка бесконечной ленты из 20 партнеров / спонсоров
    function renderPartnersMarquee() {
      const track = document.getElementById('partners-marquee-track');
      if (!track) return;

      const directionClass = SITE_CONFIG.PARTNERS_DIRECTION === 'right' ? 'dir-right' : 'dir-left';
      track.classList.remove('dir-left', 'dir-right');
      track.classList.add(directionClass);
      track.style.setProperty('--marquee-duration', `${SITE_CONFIG.PARTNERS_SPEED_SECONDS || 42}s`);

      const buildPartnerCard = (partner, index, isDuplicate = false) => {
        const num = String(index + 1).padStart(2, '0');
        const hasImage = partner.image && partner.image.trim() !== '';

        const mediaHtml = hasImage
          ? `<img
               src="${partner.image.trim()}"
               alt="${partner.name}"
               loading="lazy"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
               class="w-full h-full object-cover"
             />
             <div style="display:none" class="w-full h-full flex-col items-center justify-center bg-[#FAF9F6] p-2">
               <span class="font-mono-code text-xs font-bold text-[#0047AB]">${num}</span>
               <span class="w-4 h-0.5 bg-[#111111] mt-1"></span>
             </div>`
          : `<div class="w-full h-full flex flex-col items-center justify-center bg-[#FAF9F6] group-hover:bg-[#111111] transition-colors p-2">
               <span class="font-mono-code text-sm sm:text-base font-bold text-[#0047AB] group-hover:text-[#FAF9F6] transition-colors">${num}</span>
               <span class="w-5 h-0.5 bg-[#111111] group-hover:bg-[#0047AB] mt-1.5 transition-colors"></span>
             </div>`;

        return `
          <div ${isDuplicate ? 'aria-hidden="true"' : ''} class="group flex flex-col items-center w-24 sm:w-28 shrink-0 mr-6 sm:mr-8">
            <div class="w-20 h-20 sm:w-24 sm:h-24 aspect-square border-2 border-[#111111] bg-[#FAF9F6] overflow-hidden flex items-center justify-center transition-transform duration-200 group-hover:-translate-y-1">
              ${mediaHtml}
            </div>
            <p class="mt-2.5 text-xs sm:text-sm font-bold text-center text-[#111111] leading-tight line-clamp-2 w-full">
              ${partner.name}
            </p>
          </div>
        `;
      };

      const singleSetHtml = SITE_CONFIG.PARTNERS.map((p, idx) => buildPartnerCard(p, idx, false)).join('');
      const duplicateSetHtml = SITE_CONFIG.PARTNERS.map((p, idx) => buildPartnerCard(p, idx, true)).join('');

      track.innerHTML = singleSetHtml + duplicateSetHtml;
    }

    // Отрисовка разделов выдвижного меню
    function renderMenu(lang) {
      const container = document.getElementById('menu-sections-container');
      container.innerHTML = SITE_CONFIG.MENU_SECTIONS.map((section) => {
        const sectionTitle = section.title[lang] || section.title.ru;
        const itemsHtml = section.items
          .map((item) => {
            const label = item.label[lang] || item.label.ru;
            const isActive = item.href === SITE_CONFIG.currentPath;
            const activeClass = isActive ? 'text-[#0047AB] font-bold' : 'hover:text-[#0047AB]';
            return `
              <li>
                <a href="${item.href}" data-menu-link class="${activeClass} transition-colors inline-flex items-center gap-2">
                  <span>•</span><span>${label}</span>
                </a>
              </li>
            `;
          })
          .join('');

        if (section.type === 'accordion') {
          const isOpen = openAccordions.has(section.id);
          return `
            <div>
              <button
                type="button"
                data-accordion-toggle="${section.id}"
                aria-expanded="${isOpen}"
                class="w-full flex items-center justify-between text-left text-sm font-extrabold uppercase tracking-wider text-[#111111] hover:text-[#0047AB] transition-colors cursor-pointer"
              >
                <span>${sectionTitle}</span>
                <span class="accordion-arrow text-xs transition-transform duration-150" style="transform: ${isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}">▼</span>
              </button>
              <ul id="acc-${section.id}" class="accordion-content ${isOpen ? 'open' : ''} space-y-2.5 pl-1 pt-3 text-base font-medium">
                ${itemsHtml}
              </ul>
            </div>
          `;
        }

        return `
          <div>
            <p class="text-sm font-extrabold uppercase tracking-wider text-[#111111] mb-3">
              ${sectionTitle}
            </p>
            <ul class="space-y-2.5 pl-1 text-base font-medium">
              ${itemsHtml}
            </ul>
          </div>
        `;
      }).join('');

      container.querySelectorAll('[data-accordion-toggle]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-accordion-toggle');
          const content = document.getElementById(`acc-${id}`);
          const arrow = btn.querySelector('.accordion-arrow');
          const nowOpen = content.classList.toggle('open');
          if (nowOpen) {
            openAccordions.add(id);
          } else {
            openAccordions.delete(id);
          }
          btn.setAttribute('aria-expanded', String(nowOpen));
          if (arrow) {
            arrow.style.transform = nowOpen ? 'rotate(180deg)' : 'rotate(0deg)';
          }
        });
      });

      container.querySelectorAll('[data-menu-link]').forEach((link) => {
        link.addEventListener('click', closeMenu);
      });
    }

    // Отрисовка основного контента страницы на выбранном языке
    function renderPageContent(lang) {
      const c = SITE_CONFIG.CONTENT[lang] || SITE_CONFIG.CONTENT.ru;

      document.getElementById('company-intro-text').innerHTML = c.companyIntro;
      document.getElementById('company-launch-text').textContent = c.companyLaunch;
      document.getElementById('partners-heading').textContent = c.partnersHeading;

      document.getElementById('about-project-heading').textContent = c.aboutHeading;
      document.getElementById('about-project-paragraphs').innerHTML = c.aboutParagraphs
        .map((p) => `<p>${p}</p>`)
        .join('');

      document.getElementById('mission-heading').textContent = c.missionHeading;
      document.getElementById('mission-text').textContent = c.missionText;

      document.getElementById('goals-heading').textContent = c.goalsHeading;
      document.getElementById('goals-list').innerHTML = c.goalsList
        .map(
          (goal) => `
            <li class="flex items-start gap-3">
              <span class="text-[#0047AB] font-extrabold select-none">■</span>
              <span>${goal}</span>
            </li>
          `
        )
        .join('');

      document.getElementById('approach-heading').textContent = c.approachHeading;
      document.getElementById('approach-text').textContent = c.approachText;

      document.getElementById('future-heading').textContent = c.futureHeading;
      document.getElementById('future-text').innerHTML = c.futureText;
    }

    // Отрисовка эталонного футера
    function renderFooter(lang) {
      const linksList = document.getElementById('footer-links-list');
      linksList.innerHTML = SITE_CONFIG.FOOTER_LINKS.map((link) => {
        const label = link.label[lang] || link.label.ru;
        return `
          <li>
            <a href="${link.href}" class="hover:text-[#0047AB] transition-colors inline-block">
              ${label}
            </a>
          </li>
        `;
      }).join('');

      const c = SITE_CONFIG.CONTENT[lang] || SITE_CONFIG.CONTENT.ru;
      document.getElementById('footer-contacts-title').textContent = c.contactsTitle;

      const contactsList = document.getElementById('footer-contacts-list');
      contactsList.innerHTML = SITE_CONFIG.CONTACTS.map((contact) => {
        if (contact.href) {
          const isExternal = contact.href.startsWith('http');
          return `
            <p>
              <a
                href="${contact.href}"
                ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}
                class="hover:text-[#0047AB] transition-colors"
              >
                ${contact.text}
              </a>
            </p>
          `;
        }
        return `<p>${contact.text}</p>`;
      }).join('');
    }

    // Переключение языка
    function setLanguage(lang) {
      if (!SITE_CONFIG.CONTENT[lang]) return;
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const isActive = btn.getAttribute('data-lang-btn') === lang;
        if (isActive) {
          btn.classList.add('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.remove('bg-[#FAF9F6]', 'text-[#111111]');
        } else {
          btn.classList.remove('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.add('bg-[#FAF9F6]', 'text-[#111111]');
        }
      });

      renderMenu(lang);
      renderPageContent(lang);
      renderFooter(lang);
    }

    // Управление выдвижным меню
    const menuOpenBtn = document.getElementById('menu-open-btn');
    const menuCloseBtn = document.getElementById('menu-close-btn');
    const slideMenu = document.getElementById('slide-menu');
    const menuBackdrop = document.getElementById('menu-backdrop');

    function openMenu() {
      slideMenu.classList.remove('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'false');
      menuBackdrop.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      slideMenu.classList.add('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'true');
      menuBackdrop.classList.add('hidden');
      document.body.style.overflow = '';
    }

    menuOpenBtn.addEventListener('click', openMenu);
    menuCloseBtn.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLanguage(btn.getAttribute('data-lang-btn'));
      });
    });

    // Плавное появление секций при загрузке и прокрутке
    const revealBlocks = document.querySelectorAll('.reveal-block');
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(
        (entries, obs) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              obs.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -30px 0px' }
      );
      revealBlocks.forEach((block) => observer.observe(block));
    } else {
      revealBlocks.forEach((block) => block.classList.add('is-visible'));
    }

    // Инициализация страницы
    renderPartnersMarquee();
    setLanguage(currentLang);
  </script>
