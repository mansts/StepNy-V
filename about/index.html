<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepNy Debate — О турнире</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      border-radius: 0px !important;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F6;
      color: #111111;
      overflow-x: hidden;
    }
    h1, h2, h3, .font-display {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .reveal-section {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-section {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#111111] antialiased selection:bg-[#0047AB] selection:text-[#FAF9F6] min-h-screen flex flex-col justify-between">

  <!-- Единая шапка и меню -->
  <div id="site-header"></div>

  <main class="w-full max-w-5xl mx-auto px-4 sm:px-6 flex-grow">

    <!-- 1. Hero + Цели турнира -->
    <section class="reveal-section pt-10 sm:pt-16 pb-10 sm:pb-12 border-b-2 border-[#111111]">
      <div class="max-w-3xl mb-8 sm:mb-10">
        <p id="ab-eyebrow" class="font-mono-code text-xs sm:text-sm font-semibold uppercase tracking-widest text-[#0047AB] mb-3">
          STEPNY DEBATE
        </p>
        <h1 id="ab-heading" class="text-3xl sm:text-5xl font-extrabold tracking-tight uppercase leading-[1.08] mb-4">
          О ТУРНИРЕ
        </h1>
      </div>

      <div class="border-2 border-[#111111] bg-[#EFECE4] p-6 sm:p-8">
        <h2 id="ab-goals-title" class="text-lg sm:text-xl font-extrabold uppercase tracking-tight mb-3">
          ЦЕЛИ ТУРНИРА
        </h2>
        <p id="ab-goals-text" class="text-base sm:text-lg leading-relaxed text-[#222222] max-w-3xl"></p>
      </div>
    </section>

    <!-- 2. Формат проведения + кнопки этапов -->
    <section class="reveal-section py-10 sm:py-14 border-b-2 border-[#111111]">
      <h2 id="ab-format-title" class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight mb-6 sm:mb-8">
        ФОРМАТ ПРОВЕДЕНИЯ
      </h2>

      <div id="format-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 border-t-2 border-l-2 border-[#111111] mb-8"></div>

      <div class="flex flex-col sm:flex-row gap-4">
        <a
          id="btn-stage-1"
          href="/docs/#stage1"
          class="inline-flex items-center justify-between gap-4 px-6 py-4 bg-[#111111] text-[#FAF9F6] border-2 border-[#111111] text-xs sm:text-sm font-bold uppercase tracking-widest hover:bg-[#0047AB] hover:border-[#0047AB] active:scale-[0.98] transition-all"
        >
          <span id="btn-stage-1-text">Подробнее об 1 этапе</span>
          <span aria-hidden="true">→</span>
        </a>
        <a
          id="btn-stage-2"
          href="/docs/#stage2"
          class="inline-flex items-center justify-between gap-4 px-6 py-4 bg-[#FAF9F6] text-[#111111] border-2 border-[#111111] text-xs sm:text-sm font-bold uppercase tracking-widest hover:bg-[#111111] hover:text-[#FAF9F6] active:scale-[0.98] transition-all"
        >
          <span id="btn-stage-2-text">Подробнее об 2 этапе</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <!-- 3. Формат дебатов -->
    <section class="reveal-section py-10 sm:py-14 border-b-2 border-[#111111]">
      <h2 id="ab-debate-title" class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight mb-4">
        ФОРМАТ ДЕБАТОВ
      </h2>
      <p id="ab-debate-intro" class="text-base sm:text-lg leading-relaxed text-[#222222] max-w-3xl mb-8"></p>

      <!-- Задача команд -->
      <h3 id="ab-roles-title" class="font-mono-code text-xs sm:text-sm font-semibold uppercase tracking-widest text-[#0047AB] mb-4">
        ЗАДАЧА КОМАНД
      </h3>
      <div id="roles-grid" class="grid grid-cols-1 md:grid-cols-2 border-2 border-[#111111] mb-8"></div>

      <!-- Регламент в цифрах -->
      <div id="rules-stats" class="grid grid-cols-2 lg:grid-cols-4 border-t-2 border-l-2 border-[#111111] mb-6"></div>

      <div class="space-y-3 text-base sm:text-lg leading-relaxed text-[#222222] max-w-3xl">
        <p id="ab-debate-rules"></p>
        <p>
          <span id="ab-debate-docs-prefix">Подробнее в документации:</span>
          <a href="/docs/" class="font-mono-code font-semibold text-[#0047AB] underline underline-offset-4 hover:text-[#111111] transition-colors">
            stepny.online/docs
          </a>
        </p>
      </div>
    </section>

    <!-- 4. Почему стоит участвовать? -->
    <section class="reveal-section py-10 sm:py-14 border-b-2 border-[#111111]">
      <h2 id="ab-why-title" class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight mb-6 sm:mb-8">
        ПОЧЕМУ СТОИТ УЧАСТВОВАТЬ?
      </h2>
      <ul id="why-list" class="border-t-2 border-[#111111]"></ul>
    </section>

    <!-- 5. Награждение -->
    <section class="reveal-section py-10 sm:py-14">
      <div class="border-2 border-[#111111] bg-[#EFECE4] p-6 sm:p-8">
        <h2 id="ab-awards-title" class="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight mb-6">
          НАГРАЖДЕНИЕ
        </h2>
        <div id="awards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
      </div>
    </section>

  </main>

  <!-- Единый футер -->
  <div id="site-footer"></div>

  <!-- 1. Сначала общий layout.js -->
  <script src="/layout.js"></script>

  <!-- 2. Логика страницы -->

    document.getElementById('btn-stage-1').setAttribute('href', PAGE_DATA.LINKS.stage1);
    document.getElementById('btn-stage-2').setAttribute('href', PAGE_DATA.LINKS.stage2);

    function updatePageContent(lang) {
      const t = PAGE_DATA.CONTENT[lang] || PAGE_DATA.CONTENT.ru;

      document.getElementById('ab-eyebrow').textContent = t.eyebrow;
      document.getElementById('ab-heading').textContent = t.heading;
      document.getElementById('ab-goals-title').textContent = t.goalsTitle;
      document.getElementById('ab-goals-text').textContent = t.goalsText;

      // Формат проведения
      document.getElementById('ab-format-title').textContent = t.formatTitle;
      document.getElementById('format-grid').innerHTML = t.formatItems
        .map(
          (item) => `
            <div class="p-5 sm:p-6 bg-[#FAF9F6] border-r-2 border-b-2 border-[#111111]">
              <p class="font-mono-code text-xs uppercase tracking-wider text-[#666666] mb-1.5">${item.label}</p>
              <p class="font-display text-lg sm:text-xl font-bold text-[#111111]">${item.value}</p>
            </div>
          `
        )
        .join('');

      document.getElementById('btn-stage-1-text').textContent = t.stage1Btn;
      document.getElementById('btn-stage-2-text').textContent = t.stage2Btn;

      // Формат дебатов
      document.getElementById('ab-debate-title').textContent = t.debateTitle;
      document.getElementById('ab-debate-intro').textContent = t.debateIntro;
      document.getElementById('ab-roles-title').textContent = t.rolesTitle;

      document.getElementById('roles-grid').innerHTML = t.roles
        .map((role, idx) => {
          const isDark = idx === 0;
          const theme = isDark ? 'bg-[#111111] text-[#FAF9F6]' : 'bg-[#FAF9F6] text-[#111111]';
          const border = idx > 0 ? 'border-t-2 md:border-t-0 md:border-l-2 border-[#111111]' : '';
          return `
            <div class="${theme} ${border} p-6 sm:p-8">
              <span class="font-mono-code text-xs uppercase tracking-widest opacity-60 block mb-2">${role.tag}</span>
              <h3 class="text-xl sm:text-2xl font-extrabold mb-2">${role.title}</h3>
              <p class="text-sm sm:text-base leading-relaxed opacity-85">${role.text}</p>
            </div>
          `;
        })
        .join('');

      document.getElementById('rules-stats').innerHTML = t.stats
        .map(
          (s) => `
            <div class="p-5 bg-[#FAF9F6] border-r-2 border-b-2 border-[#111111]">
              <p class="font-display text-2xl sm:text-3xl font-extrabold text-[#0047AB] mb-1">${s.num}</p>
              <p class="text-xs sm:text-sm text-[#333333] leading-snug">${s.label}</p>
            </div>
          `
        )
        .join('');

      document.getElementById('ab-debate-rules').textContent = t.debateRules;
      document.getElementById('ab-debate-docs-prefix').textContent = t.docsPrefix;

      // Почему стоит участвовать
      document.getElementById('ab-why-title').textContent = t.whyTitle;
      document.getElementById('why-list').innerHTML = t.whyItems
        .map(
          (item, idx) => `
            <li class="py-4 sm:py-5 border-b-2 border-[#111111] flex items-baseline gap-4 sm:gap-6">
              <span class="font-mono-code text-sm font-bold text-[#0047AB] shrink-0">0${idx + 1}</span>
              <span class="text-base sm:text-lg font-medium text-[#111111]">${item}</span>
            </li>
          `
        )
        .join('');

      // Награждение
      document.getElementById('ab-awards-title').textContent = t.awardsTitle;
      document.getElementById('awards-grid').innerHTML = t.awardsCards
        .map(
          (card) => `
            <div class="border-2 border-[#111111] bg-[#FAF9F6] p-5 sm:p-6">
              <p class="font-mono-code text-xs font-bold uppercase tracking-widest text-[#0047AB] mb-2">${card.tag}</p>
              <p class="text-sm sm:text-base leading-relaxed text-[#222222]">${card.text}</p>
            </div>
          `
        )
        .join('');
    }

    // Синхронизация языка с layout.js
    window.addEventListener('stepny:langchange', (e) => {
      updatePageContent(e.detail.lang);
    });
    updatePageContent(localStorage.getItem('stepny_lang') || 'ru');

    // Плавное появление секций
    const revealSections = document.querySelectorAll('.reveal-section');
    if ('IntersectionObserver' in window) {
      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -30px 0px' }
      );
      revealSections.forEach((section) => revealObserver.observe(section));
    } else {
      revealSections.forEach((section) => section.classList.add('is-visible'));
    }
  </script>
</body>
</html>
