<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepNy Debate — Документация</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      border-radius: 0px !important;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F6;
      color: #111111;
      overflow-x: hidden;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .accordion-content {
      display: none;
    }
    .accordion-content.open {
      display: block;
    }
    .reveal-section {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-[#FAF9F6] text-[#111111] antialiased selection:bg-[#0047AB] selection:text-[#FAF9F6] min-h-screen flex flex-col justify-between">

  <!-- Шапка сайта -->
  <header class="sticky top-0 z-40 bg-[#FAF9F6] border-b-2 border-[#111111]">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-3">
      <!-- Логотип со ссылкой на главную страницу -->
      <a id="header-logo-link" href="/" class="text-xl sm:text-2xl font-extrabold tracking-tight text-[#111111] select-none shrink-0">
        Step<span class="text-[#0047AB]">Ny</span> Debate
      </a>

      <!-- Переключатель языков и кнопка меню (три горизонтальные линии) -->
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- Прямоугольная коробка языков -->
        <div role="group" aria-label="Language switcher" class="inline-flex border-2 border-[#111111] bg-[#FAF9F6]">
          <button
            type="button"
            data-lang-btn="kz"
            class="lang-btn px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm font-bold uppercase tracking-wider border-r-2 border-[#111111] transition-colors cursor-pointer"
          >
            kz
          </button>
          <button
            type="button"
            data-lang-btn="ru"
            class="lang-btn px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm font-bold uppercase tracking-wider border-r-2 border-[#111111] transition-colors cursor-pointer"
          >
            ru
          </button>
          <button
            type="button"
            data-lang-btn="en"
            class="lang-btn px-2.5 sm:px-3 py-1.5 text-xs sm:text-sm font-bold uppercase tracking-wider transition-colors cursor-pointer"
          >
            en
          </button>
        </div>

        <!-- Кнопка меню (три горизонтальные линии) -->
        <button
          id="menu-open-btn"
          type="button"
          aria-label="Открыть меню"
          class="p-2.5 border-2 border-[#111111] bg-[#FAF9F6] hover:bg-[#111111] hover:text-[#FAF9F6] active:scale-95 transition-all cursor-pointer flex flex-col justify-center items-center gap-1.5 w-11 h-10"
        >
          <span class="block w-5 h-0.5 bg-current"></span>
          <span class="block w-5 h-0.5 bg-current"></span>
          <span class="block w-5 h-0.5 bg-current"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Выдвижное меню -->
  <div id="menu-backdrop" class="fixed inset-0 z-50 bg-[#111111]/40 hidden"></div>
  <aside
    id="slide-menu"
    aria-hidden="true"
    class="fixed top-0 right-0 z-50 h-full w-full max-w-sm bg-[#FAF9F6] border-l-2 border-[#111111] transform translate-x-full transition-transform duration-200 ease-out flex flex-col justify-between overflow-y-auto"
  >
    <div class="p-6 sm:p-8">
      <!-- Верхняя панель меню: логотип StepNy Debate, переключатель языков и кнопка закрытия в одну строку -->
      <div class="flex items-center justify-between gap-2 pb-6 mb-6 border-b-2 border-[#111111]">
        <a id="menu-logo-link" href="/" class="text-base sm:text-lg font-extrabold tracking-tight text-[#111111] truncate">
          Step<span class="text-[#0047AB]">Ny</span> Debate
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <div role="group" aria-label="Menu language switcher" class="inline-flex border-2 border-[#111111] bg-[#FAF9F6] shrink-0">
            <button
              type="button"
              data-lang-btn="kz"
              class="lang-btn px-2 py-1.5 text-xs font-bold uppercase tracking-wider border-r-2 border-[#111111] transition-colors cursor-pointer"
            >
              kz
            </button>
            <button
              type="button"
              data-lang-btn="ru"
              class="lang-btn px-2 py-1.5 text-xs font-bold uppercase tracking-wider border-r-2 border-[#111111] transition-colors cursor-pointer"
            >
              ru
            </button>
            <button
              type="button"
              data-lang-btn="en"
              class="lang-btn px-2 py-1.5 text-xs font-bold uppercase tracking-wider transition-colors cursor-pointer"
            >
              en
            </button>
          </div>

          <button
            id="menu-close-btn"
            type="button"
            aria-label="Закрыть меню"
            class="w-9 h-9 shrink-0 border-2 border-[#111111] flex items-center justify-center text-base font-bold hover:bg-[#111111] hover:text-[#FAF9F6] transition-colors cursor-pointer"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- Разделы меню генерируются автоматически из SITE_CONFIG.MENU_SECTIONS -->
      <nav id="menu-sections-container" class="space-y-7 text-[#111111]"></nav>
    </div>

    <!-- Подвал меню -->
    <div class="p-6 sm:p-8 text-sm font-extrabold text-[#111111]">
      © Step<span class="text-[#0047AB]">Ny</span> Debate
    </div>
  </aside>

  <!-- Основной контент страницы Документации -->
  <main id="documentation" class="w-full max-w-5xl mx-auto px-4 sm:px-6 flex-grow">
    <section class="reveal-section py-10 sm:py-16">
      <h1 id="docs-page-heading" class="text-3xl sm:text-5xl font-extrabold tracking-tight uppercase mb-8 sm:mb-10">
        ДОКУМЕНТАЦИЯ
      </h1>

      <!-- Вертикальный стек кликабельных карточек документов генерируется из SITE_CONFIG.DOCUMENTS -->
      <div id="documents-stack" class="flex flex-col gap-4"></div>
    </section>
  </main>

  <!-- Эталонный футер (#EFECE4) без разделительных линий и рамок -->
  <footer class="w-full bg-[#EFECE4] mt-6">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 items-start">
        <!-- Левая колонка: бренд и навигация футера из SITE_CONFIG.FOOTER_LINKS -->
        <div>
          <p class="text-xl sm:text-2xl font-extrabold tracking-tight text-[#111111] mb-6">
            © Step<span class="text-[#0047AB]">Ny</span> Debate
          </p>
          <ul id="footer-links-list" class="space-y-3 text-base font-semibold"></ul>
        </div>

        <!-- Правая колонка: контакты из SITE_CONFIG.CONTACTS -->
        <div class="space-y-2 text-base">
          <p id="footer-contacts-title" class="font-extrabold text-[#111111] mb-2">
            Контакты:
          </p>
          <div id="footer-contacts-list" class="space-y-2 font-medium"></div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    /**
     * ============================================================================
     * БЫСТРАЯ КОНФИГУРАЦИЯ САЙТА (SITE_CONFIG)
     * Здесь можно в одном месте легко добавлять, удалять или менять ссылки,
     * пункты меню, разделы футера, контакты и список PDF-документов.
     * ============================================================================
     */
    const SITE_CONFIG = {
      defaultLang: 'ru',
      currentPath: '/docs',

      // 1. Основные маршруты сайта
      ROUTES: {
        home: '/',
        aboutProject: '/aboutus',
        tournament: '/about',
        docs: '/docs',
        faq: '/faq',
        sponsors: '/sponsors',
        registration: '/registration',
        status: '/status',
        team: '/team',
        results: '/results',
        contact: '/contact',
        report: '/report'
      },

      // 2. Заголовки страницы
      PAGE_TITLES: {
        kz: { docsHeading: 'ҚҰЖАТТАМА', contactsTitle: 'Байланыс:' },
        ru: { docsHeading: 'ДОКУМЕНТАЦИЯ', contactsTitle: 'Контакты:' },
        en: { docsHeading: 'DOCUMENTATION', contactsTitle: 'Contacts:' }
      },

      // 3. Разделы выдвижного меню (type: 'list' — обычный список, 'accordion' — раскрывающийся список)
      MENU_SECTIONS: [
        {
          id: 'nav',
          type: 'list',
          title: { kz: '1. Навигация', ru: '1. Навигация', en: '1. Navigation' },
          items: [
            { href: '/', label: { kz: 'Басты бет', ru: 'Главная', en: 'Home' } },
            { href: '/aboutus', label: { kz: 'Жоба туралы', ru: 'О проекте', en: 'About Project' } },
            { href: '/about', label: { kz: 'Турнир', ru: 'Турнир', en: 'Tournament' } },
            { href: '/docs', label: { kz: 'Құжаттар', ru: 'Документы', en: 'Documents' } },
            { href: '/faq', label: { kz: 'Жиі қойылатын сұрақтар', ru: 'Часто задаваемые вопросы', en: 'Frequently Asked Questions' } }
          ]
        },
        {
          id: 'participants',
          type: 'accordion',
          title: { kz: '2. Қатысушыларға', ru: '2. Участникам', en: '2. For Participants' },
          items: [
            { href: '/registration', label: { kz: 'Менің тіркелуім', ru: 'Моя регистрация', en: 'My Registration' } },
            { href: '/status', label: { kz: 'Өтінім мәртебесі', ru: 'Статус заявки', en: 'Application Status' } },
            { href: '/team', label: { kz: 'Команда туралы ақпарат', ru: 'Информация о команде', en: 'Team Information' } },
            { href: '/results', label: { kz: 'Турнир нәтижелері', ru: 'Результаты турнира', en: 'Tournament Results' } }
          ]
        },
        {
          id: 'general',
          type: 'accordion',
          title: { kz: '3. Жалпы мәліметтер', ru: '3. Общие сведения', en: '3. General Information' },
          items: [
            { href: '/contact', label: { kz: 'Ұйымдастырушымен байланысу', ru: 'Связаться с организатором', en: 'Contact Organizer' } },
            { href: '/sponsors', label: { kz: 'Серіктес / демеуші болу', ru: 'Стать партнером / спонсором', en: 'Become a Partner / Sponsor' } },
            { href: '/report', label: { kz: 'Мәселе туралы жазу', ru: 'Написать об проблеме', en: 'Report an Issue' } }
          ]
        }
      ],

      // 4. Ссылки в левой колонке футера
      FOOTER_LINKS: [
        { href: '/docs', label: { kz: 'Құжаттама', ru: 'Документация', en: 'Documentation' } },
        { href: '/sponsors', label: { kz: 'Серіктестер', ru: 'Партнеры', en: 'Partners' } },
        { href: '/aboutus', label: { kz: 'Біз туралы', ru: 'О нас', en: 'About Us' } },
        { href: '/about', label: { kz: 'Турнир туралы толығырақ', ru: 'Подробнее о турнире', en: 'More About the Tournament' } }
      ],

      // 5. Контакты в правой колонке футера
      CONTACTS: [
        { text: 'stepny.debate@gmail.com', href: 'mailto:stepny.debate@gmail.com' },
        { text: 'Instagram: @stepny.debate', href: 'https://instagram.com/stepny.debate' },
        { text: 'Tiktok: @stepny.debate', href: 'https://tiktok.com/@stepny.debate' },
        { text: 'Telegram: @StepNysupport', href: 'https://t.me/StepNysupport' },
        { text: 'Telegram Channel: @StepNyDebate', href: 'https://t.me/StepNyDebate' }
      ],

      // 6. Список PDF-документов (путь к файлу используется только для скачивания и скрыт из интерфейса)
      DOCUMENTS: [
        {
          num: '01',
          file: 'docs/privacy-policy.pdf',
          title: {
            kz: 'Құпиялылық саясаты',
            ru: 'Политика Конфиденциальности',
            en: 'Privacy Policy'
          }
        },
        {
          num: '02',
          file: 'docs/terms-of-use.pdf',
          title: {
            kz: 'Пайдалану шарттары',
            ru: 'Условия пользования',
            en: 'Terms of Use'
          }
        },
        {
          num: '03',
          file: 'docs/personal-data-terms.pdf',
          title: {
            kz: 'Дербес деректерді өңдеу шарттары',
            ru: 'Условия обработки персональных данных',
            en: 'Personal Data Processing Terms'
          }
        },
        {
          num: '04',
          file: 'docs/personal-data-consent.pdf',
          title: {
            kz: 'Дербес деректерді жинауға және өңдеуге келісім',
            ru: 'Согласие на сбор и обработку персональных данных',
            en: 'Consent to Collection and Processing of Personal Data'
          }
        },
        {
          num: '05',
          file: 'docs/cookie-policy.pdf',
          title: {
            kz: 'Cookie файлдарын пайдалану саясаты',
            ru: 'Политика использования Cookie',
            en: 'Cookie Policy'
          }
        },
        {
          num: '06',
          file: 'docs/photo-video-consent.pdf',
          title: {
            kz: 'Фото және бейнетүсірілімге, материалдарды әлеуметтік желілер мен сайтта жариялауға келісім',
            ru: 'Согласие на фото- и видеосъёмку и публикацию материалов в социальные сети и на сайт',
            en: 'Consent to Photo and Video Recording and Publication on Social Media and Website'
          }
        },
        {
          num: '07',
          file: 'docs/parental-consent.pdf',
          title: {
            kz: 'Ата-ананың немесе заңды өкілдің келісімі',
            ru: 'Согласие родителя или законного представителя',
            en: 'Consent of Parent or Legal Representative'
          }
        }
      ]
    };

    let currentLang = SITE_CONFIG.defaultLang;
    const openAccordions = new Set();

    // Привязка маршрутов логотипов
    document.getElementById('header-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);
    document.getElementById('menu-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);

    // Отрисовка разделов меню
    function renderMenu(lang) {
      const container = document.getElementById('menu-sections-container');
      container.innerHTML = SITE_CONFIG.MENU_SECTIONS.map((section) => {
        const sectionTitle = section.title[lang] || section.title.ru;
        const itemsHtml = section.items
          .map((item) => {
            const label = item.label[lang] || item.label.ru;
            const isActive = item.href === SITE_CONFIG.currentPath;
            const activeClass = isActive ? 'text-[#0047AB] font-bold' : 'hover:text-[#0047AB]';
            return `
              <li>
                <a href="${item.href}" data-menu-link class="${activeClass} transition-colors inline-flex items-center gap-2">
                  <span>•</span><span>${label}</span>
                </a>
              </li>
            `;
          })
          .join('');

        if (section.type === 'accordion') {
          const isOpen = openAccordions.has(section.id);
          return `
            <div>
              <button
                type="button"
                data-accordion-toggle="${section.id}"
                aria-expanded="${isOpen}"
                class="w-full flex items-center justify-between text-left text-sm font-extrabold uppercase tracking-wider text-[#111111] hover:text-[#0047AB] transition-colors cursor-pointer"
              >
                <span>${sectionTitle}</span>
                <span class="accordion-arrow text-xs transition-transform duration-150" style="transform: ${isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}">▼</span>
              </button>
              <ul id="acc-${section.id}" class="accordion-content ${isOpen ? 'open' : ''} space-y-2.5 pl-1 pt-3 text-base font-medium">
                ${itemsHtml}
              </ul>
            </div>
          `;
        }

        return `
          <div>
            <p class="text-sm font-extrabold uppercase tracking-wider text-[#111111] mb-3">
              ${sectionTitle}
            </p>
            <ul class="space-y-2.5 pl-1 text-base font-medium">
              ${itemsHtml}
            </ul>
          </div>
        `;
      }).join('');

      // Привязка обработчиков аккордеонов
      container.querySelectorAll('[data-accordion-toggle]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-accordion-toggle');
          const content = document.getElementById(`acc-${id}`);
          const arrow = btn.querySelector('.accordion-arrow');
          const nowOpen = content.classList.toggle('open');
          if (nowOpen) {
            openAccordions.add(id);
          } else {
            openAccordions.delete(id);
          }
          btn.setAttribute('aria-expanded', String(nowOpen));
          if (arrow) {
            arrow.style.transform = nowOpen ? 'rotate(180deg)' : 'rotate(0deg)';
          }
        });
      });

      // Закрытие меню при клике на ссылку
      container.querySelectorAll('[data-menu-link]').forEach((link) => {
        link.addEventListener('click', closeMenu);
      });
    }

    // Отрисовка футера
    function renderFooter(lang) {
      const linksList = document.getElementById('footer-links-list');
      linksList.innerHTML = SITE_CONFIG.FOOTER_LINKS.map((link) => {
        const label = link.label[lang] || link.label.ru;
        return `
          <li>
            <a href="${link.href}" class="hover:text-[#0047AB] transition-colors inline-block">
              ${label}
            </a>
          </li>
        `;
      }).join('');

      document.getElementById('footer-contacts-title').textContent =
        SITE_CONFIG.PAGE_TITLES[lang]?.contactsTitle || SITE_CONFIG.PAGE_TITLES.ru.contactsTitle;

      const contactsList = document.getElementById('footer-contacts-list');
      contactsList.innerHTML = SITE_CONFIG.CONTACTS.map((contact) => {
        if (contact.href) {
          const isExternal = contact.href.startsWith('http');
          return `
            <p>
              <a
                href="${contact.href}"
                ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}
                class="hover:text-[#0047AB] transition-colors"
              >
                ${contact.text}
              </a>
            </p>
          `;
        }
        return `<p>${contact.text}</p>`;
      }).join('');
    }

    // Отрисовка карточек документов (весь блок — ссылка на PDF, без видимого пути и отдельной кнопки)
    function renderDocuments(lang) {
      document.getElementById('docs-page-heading').textContent =
        SITE_CONFIG.PAGE_TITLES[lang]?.docsHeading || SITE_CONFIG.PAGE_TITLES.ru.docsHeading;

      const stack = document.getElementById('documents-stack');
      stack.innerHTML = SITE_CONFIG.DOCUMENTS.map((doc) => {
        const title = doc.title[lang] || doc.title.ru;
        return `
          <a
            href="${doc.file}"
            target="_blank"
            download
            class="group w-full border-2 border-[#111111] bg-[#FAF9F6] p-5 sm:p-6 flex items-center justify-between gap-4 hover:bg-[#111111] hover:text-[#FAF9F6] active:scale-[0.99] transition-all duration-150"
          >
            <div class="flex items-start gap-4 sm:gap-5">
              <span class="font-mono-code text-sm sm:text-base font-bold text-[#0047AB] group-hover:text-[#FAF9F6] transition-colors pt-0.5 shrink-0">
                ${doc.num}
              </span>
              <h2 class="text-base sm:text-xl font-bold tracking-tight leading-snug">
                ${title}
              </h2>
            </div>

            <span aria-hidden="true" class="text-lg sm:text-xl font-bold shrink-0 transform group-hover:translate-x-1 transition-transform">
              →
            </span>
          </a>
        `;
      }).join('');
    }

    // Переключение языка интерфейса
    function setLanguage(lang) {
      if (!SITE_CONFIG.PAGE_TITLES[lang]) return;
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const isActive = btn.getAttribute('data-lang-btn') === lang;
        if (isActive) {
          btn.classList.add('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.remove('bg-[#FAF9F6]', 'text-[#111111]');
        } else {
          btn.classList.remove('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.add('bg-[#FAF9F6]', 'text-[#111111]');
        }
      });

      renderMenu(lang);
      renderFooter(lang);
      renderDocuments(lang);
    }

    // Управление выдвижным меню
    const menuOpenBtn = document.getElementById('menu-open-btn');
    const menuCloseBtn = document.getElementById('menu-close-btn');
    const slideMenu = document.getElementById('slide-menu');
    const menuBackdrop = document.getElementById('menu-backdrop');

    function openMenu() {
      slideMenu.classList.remove('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'false');
      menuBackdrop.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      slideMenu.classList.add('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'true');
      menuBackdrop.classList.add('hidden');
      document.body.style.overflow = '';
    }

    menuOpenBtn.addEventListener('click', openMenu);
    menuCloseBtn.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLanguage(btn.getAttribute('data-lang-btn'));
      });
    });

    // Плавное появление секций
    const revealSections = document.querySelectorAll('.reveal-section');
    if ('IntersectionObserver' in window) {
      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -30px 0px' }
      );
      revealSections.forEach((section) => revealObserver.observe(section));
    } else {
      revealSections.forEach((section) => section.classList.add('is-visible'));
    }

    // Инициализация языка по умолчанию
    setLanguage(currentLang);
  </script>
</body>
</html>
