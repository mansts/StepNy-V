    * {
      border-radius: 0px !important;
      box-sizing: border-box;

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF9F6;
      color: #111111;
      overflow-x: hidden;

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .accordion-content {
      display: none;
    }
    .accordion-content.open {
      display: block;
    }
    .reveal-section {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .page-switch-anim {
      animation: fadeSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>

    // Определение активного подраздела из URL (?page=... или #...)
    function resolveSubpageFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryPage = (params.get('page') || '').toLowerCase();
      const hashPage = (window.location.hash || '').replace('#', '').toLowerCase();
      const candidate = queryPage || hashPage;

      if (SITE_CONFIG.PAGES[candidate]) {
        return candidate;
      }
      return SITE_CONFIG.defaultSubpage;
    }

    // Переключение активного подраздела
    function setSubpage(subpageKey, updateHistory = true) {
      if (!SITE_CONFIG.PAGES[subpageKey]) return;
      currentSubpage = subpageKey;

      if (updateHistory) {
        const newHash = `#${subpageKey}`;
        if (window.location.hash !== newHash) {
          history.replaceState(null, '', newHash);
        }
      }

      renderSubpageContent(currentLang, currentSubpage);
      renderMenu(currentLang);
    }

    // Привязка маршрутов логотипов
    document.getElementById('header-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);
    document.getElementById('menu-logo-link').setAttribute('href', SITE_CONFIG.ROUTES.home);

      void container.offsetWidth;
      container.classList.add('page-switch-anim');

          <p class="text-base sm:text-xl leading-relaxed font-normal text-[#111111]">
            ${text}
          </p>
        `
        )
        .join('');

        const isExternal = item.href.startsWith('http');

          <a
            href="${item.href}"
            ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}
            class="group border-2 border-[#111111] bg-[#FAF9F6] p-5 sm:p-6 flex items-center justify-between gap-4 hover:bg-[#111111] hover:text-[#FAF9F6] active:scale-[0.99] transition-all duration-150"

              →
            </span>
          </a>
        `;
      }).join('');

      const socialsHtml = SITE_CONFIG.SOCIAL_SECTION.items
        .map(

            href="${soc.href}"
            target="_blank"
            rel="noopener noreferrer"
            class="group border-2 border-[#111111] bg-[#FAF9F6] p-4 sm:p-5 flex items-center justify-between gap-3 hover:bg-[#111111] hover:text-[#FAF9F6] active:scale-[0.99] transition-all duration-150"

              <span class="block text-xs font-bold uppercase tracking-widest text-[#0047AB] group-hover:text-[#FAF9F6] transition-colors mb-1">
                ${soc.label}
              </span>
              <span class="text-sm sm:text-base font-bold">
                ${soc.value}
              </span>
            </div>
            <span aria-hidden="true" class="text-base font-bold shrink-0 transform group-hover:translate-x-1 transition-transform">
              →
            </span>
          </a>
        `
        )
        .join('');

      container.innerHTML = `
        <div class="mb-8 sm:mb-10">
          <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-[1.1]">
            ${heading}
          </h1>
        </div>

        <div class="max-w-3xl space-y-4 mb-10">
          ${paragraphsHtml}
        </div>

        <!-- Прямые контакты: Email и Telegram -->
        <div class="mb-12">
          <h2 class="text-sm font-extrabold uppercase tracking-wider text-[#111111] mb-4">
            ${contactsHeading}
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${directContactsHtml}
          </div>
        </div>

        <!-- Блок «Также наши соц-сети:» -->
        <div>
          <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight text-[#111111] mb-5">
            ${socialTitle}
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${socialsHtml}
          </div>
        </div>
      `;
    }

    // Отрисовка разделов выдвижного меню
    function renderMenu(lang) {
      const container = document.getElementById('menu-sections-container');
      container.innerHTML = SITE_CONFIG.MENU_SECTIONS.map((section) => {
        const sectionTitle = section.title[lang] || section.title.ru;
        const itemsHtml = section.items
          .map((item) => {
            const label = item.label[lang] || item.label.ru;
            const isActive = item.subpage && item.subpage === currentSubpage;
            const activeClass = isActive ? 'text-[#0047AB] font-bold' : 'hover:text-[#0047AB]';
            const subpageAttr = item.subpage ? `data-menu-subpage="${item.subpage}"` : '';
            return `
              <li>
                <a href="${item.href}" ${subpageAttr} data-menu-link class="${activeClass} transition-colors inline-flex items-center gap-2">
                  <span>•</span><span>${label}</span>
                </a>
              </li>
            `;
          })
          .join('');

        if (section.type === 'accordion') {
          const isOpen = openAccordions.has(section.id);
          return `
            <div>
              <button
                type="button"
                data-accordion-toggle="${section.id}"
                aria-expanded="${isOpen}"
                class="w-full flex items-center justify-between text-left text-sm font-extrabold uppercase tracking-wider text-[#111111] hover:text-[#0047AB] transition-colors cursor-pointer"
              >
                <span>${sectionTitle}</span>
                <span class="accordion-arrow text-xs transition-transform duration-150" style="transform: ${isOpen ? 'rotate(180deg)' : 'rotate(0deg)'}">▼</span>
              </button>
              <ul id="acc-${section.id}" class="accordion-content ${isOpen ? 'open' : ''} space-y-2.5 pl-1 pt-3 text-base font-medium">
                ${itemsHtml}
              </ul>
            </div>
          `;
        }

        return `
          <div>
            <p class="text-sm font-extrabold uppercase tracking-wider text-[#111111] mb-3">
              ${sectionTitle}
            </p>
            <ul class="space-y-2.5 pl-1 text-base font-medium">
              ${itemsHtml}
            </ul>
          </div>
        `;
      }).join('');

      container.querySelectorAll('[data-accordion-toggle]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-accordion-toggle');
          const content = document.getElementById(`acc-${id}`);
          const arrow = btn.querySelector('.accordion-arrow');
          const nowOpen = content.classList.toggle('open');
          if (nowOpen) {
            openAccordions.add(id);
          } else {
            openAccordions.delete(id);
          }
          btn.setAttribute('aria-expanded', String(nowOpen));
          if (arrow) {
            arrow.style.transform = nowOpen ? 'rotate(180deg)' : 'rotate(0deg)';
          }
        });
      });

      container.querySelectorAll('[data-menu-subpage]').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetSubpage = link.getAttribute('data-menu-subpage');
          setSubpage(targetSubpage, true);
          closeMenu();
        });
      });

      container.querySelectorAll('[data-menu-link]:not([data-menu-subpage])').forEach((link) => {
        link.addEventListener('click', closeMenu);
      });
    }

    // Отрисовка эталонного футера
    function renderFooter(lang) {
      const linksList = document.getElementById('footer-links-list');
      linksList.innerHTML = SITE_CONFIG.FOOTER_LINKS.map((link) => {
        const label = link.label[lang] || link.label.ru;
        return `
          <li>
            <a href="${link.href}" class="hover:text-[#0047AB] transition-colors inline-block">
              ${label}
            </a>
          </li>
        `;
      }).join('');

      document.getElementById('footer-contacts-title').textContent =
        SITE_CONFIG.FOOTER_CONTACTS_TITLE[lang] || SITE_CONFIG.FOOTER_CONTACTS_TITLE.ru;

      const contactsList = document.getElementById('footer-contacts-list');
      contactsList.innerHTML = SITE_CONFIG.CONTACTS.map((contact) => {
        if (contact.href) {
          const isExternal = contact.href.startsWith('http');
          return `
            <p>
              <a
                href="${contact.href}"
                ${isExternal ? 'target="_blank" rel="noopener noreferrer"' : ''}
                class="hover:text-[#0047AB] transition-colors"
              >
                ${contact.text}
              </a>
            </p>
          `;
        }
        return `<p>${contact.text}</p>`;
      }).join('');
    }

    // Переключение языка интерфейса
    function setLanguage(lang) {
      if (!SITE_CONFIG.FOOTER_CONTACTS_TITLE[lang]) return;
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        const isActive = btn.getAttribute('data-lang-btn') === lang;
        if (isActive) {
          btn.classList.add('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.remove('bg-[#FAF9F6]', 'text-[#111111]');
        } else {
          btn.classList.remove('bg-[#111111]', 'text-[#FAF9F6]');
          btn.classList.add('bg-[#FAF9F6]', 'text-[#111111]');
        }
      });

      renderMenu(lang);
      renderFooter(lang);
      renderSubpageContent(lang, currentSubpage);
    }

    // Управление выдвижным меню
    const menuOpenBtn = document.getElementById('menu-open-btn');
    const menuCloseBtn = document.getElementById('menu-close-btn');
    const slideMenu = document.getElementById('slide-menu');
    const menuBackdrop = document.getElementById('menu-backdrop');

    function openMenu() {
      slideMenu.classList.remove('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'false');
      menuBackdrop.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      slideMenu.classList.add('translate-x-full');
      slideMenu.setAttribute('aria-hidden', 'true');
      menuBackdrop.classList.add('hidden');
      document.body.style.overflow = '';
    }

    menuOpenBtn.addEventListener('click', openMenu);
    menuCloseBtn.addEventListener('click', closeMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMenu();
      }
    });

    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setLanguage(btn.getAttribute('data-lang-btn'));
      });
    });

    window.addEventListener('hashchange', () => {
      const nextSubpage = resolveSubpageFromUrl();
      if (nextSubpage !== currentSubpage) {
        setSubpage(nextSubpage, false);
      }
    });

    // Плавное появление секции
    const revealSections = document.querySelectorAll('.reveal-section');
    if ('IntersectionObserver' in window) {
      const revealObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -30px 0px' }
      );
      revealSections.forEach((section) => revealObserver.observe(section));
    } else {
      revealSections.forEach((section) => section.classList.add('is-visible'));
    }

    // Инициализация страницы
    currentSubpage = resolveSubpageFromUrl();
    setLanguage(currentLang);
  </script>
</body>
</html>
